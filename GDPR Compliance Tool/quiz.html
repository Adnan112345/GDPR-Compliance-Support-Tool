<!DOCTYPE html>
<!-- Tells the browser this is an HTML5 document -->

<html lang="en-GB">
<!-- Starts the HTML document and sets the language to British English -->

<head>
  <!-- The head contains page information for the browser -->

  <meta charset="UTF-8">
  <!-- Allows text and symbols to display correctly -->

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Makes the page responsive on different screen sizes -->

  <title>GDPR Quiz</title>
  <!-- Sets the browser tab title -->

  <link rel="stylesheet" href="css/style.css">
  <!-- Links the external CSS file used to style the page -->
</head>

<body>
<!-- Starts the visible content of the webpage -->

<header>
  <!-- Top section of the page -->

  <h1>GDPR Compliance Support Tool</h1>
  <!-- Main heading shown at the top of the page -->

  <p>Articles 5 and 6 Knowledge Check</p>
  <!-- Subtitle showing what this quiz is about -->
</header>

<main class="container">
  <!-- Main content area of the page -->

  <h2>GDPR Quiz</h2>
  <!-- Main heading for the quiz section -->

  <p>Complete the quiz below to test your understanding of Articles 5 and 6.</p>
  <!-- Introductory text explaining the purpose of the quiz -->

  <section class="question">
    <!-- Question 1 -->

    <label for="q1">1. Which principle means only collecting data that is necessary?</label>
    <!-- Label for question 1 -->

    <select id="q1">
      <!-- Dropdown menu for question 1 -->
      <option value="">Select an answer</option>
      <!-- Default placeholder option -->

      <option value="wrong">Storage limitation</option>
      <!-- Wrong answer -->

      <option value="correct">Data minimisation</option>
      <!-- Correct answer -->

      <option value="wrong">Accuracy</option>
      <!-- Wrong answer -->
    </select>
  </section>

  <section class="question">
    <!-- Question 2 -->

    <label for="q2">2. Which principle requires data to be kept secure?</label>
    <!-- Label for question 2 -->

    <select id="q2">
      <!-- Dropdown menu for question 2 -->
      <option value="">Select an answer</option>
      <option value="wrong">Purpose limitation</option>
      <!-- Wrong answer -->

      <option value="correct">Integrity and confidentiality</option>
      <!-- Correct answer -->

      <option value="wrong">Lawfulness</option>
      <!-- Wrong answer -->
    </select>
  </section>

  <section class="question">
    <!-- Question 3 -->

    <label for="q3">3. Which principle says data should not be kept longer than necessary?</label>
    <!-- Label for question 3 -->

    <select id="q3">
      <!-- Dropdown menu for question 3 -->
      <option value="">Select an answer</option>

      <option value="correct">Storage limitation</option>
      <!-- Correct answer -->

      <option value="wrong">Accuracy</option>
      <!-- Wrong answer -->

      <option value="wrong">Public task</option>
      <!-- Wrong answer -->
    </select>
  </section>

  <section class="question">
    <!-- Question 4 -->

    <label for="q4">4. Which Article covers lawful bases for processing?</label>
    <!-- Label for question 4 -->

    <select id="q4">
      <!-- Dropdown menu for question 4 -->
      <option value="">Select an answer</option>

      <option value="correct">Article 6</option>
      <!-- Correct answer -->

      <option value="wrong">Article 5</option>
      <!-- Wrong answer -->

      <option value="wrong">Article 32</option>
      <!-- Wrong answer -->
    </select>
  </section>

  <section class="question">
    <!-- Question 5 -->

    <label for="q5">5. What makes consent valid under GDPR?</label>
    <!-- Label for question 5 -->

    <select id="q5">
      <!-- Dropdown menu for question 5 -->
      <option value="">Select an answer</option>

      <option value="wrong">Silence</option>
      <!-- Wrong answer -->

      <option value="correct">Freely given, specific, informed, and unambiguous</option>
      <!-- Correct answer -->

      <option value="wrong">Pre-ticked boxes</option>
      <!-- Wrong answer -->
    </select>
  </section>

  <section class="question">
    <!-- Question 6 -->

    <label for="q6">6. Which lawful basis applies when processing is needed to meet a legal duty?</label>
    <!-- Label for question 6 -->

    <select id="q6">
      <!-- Dropdown menu for question 6 -->
      <option value="">Select an answer</option>

      <option value="correct">Legal obligation</option>
      <!-- Correct answer -->

      <option value="wrong">Consent</option>
      <!-- Wrong answer -->

      <option value="wrong">Vital interests</option>
      <!-- Wrong answer -->
    </select>
  </section>

  <section class="question">
    <!-- Question 7 -->

    <label for="q7">7. Which lawful basis may apply in a life-threatening emergency?</label>
    <!-- Label for question 7 -->

    <select id="q7">
      <!-- Dropdown menu for question 7 -->
      <option value="">Select an answer</option>

      <option value="wrong">Contract</option>
      <!-- Wrong answer -->

      <option value="correct">Vital interests</option>
      <!-- Correct answer -->

      <option value="wrong">Legitimate interests</option>
      <!-- Wrong answer -->
    </select>
  </section>

  <section class="question">
    <!-- Question 8 -->

    <label for="q8">8. What should be considered before using legitimate interests?</label>
    <!-- Label for question 8 -->

    <select id="q8">
      <!-- Dropdown menu for question 8 -->
      <option value="">Select an answer</option>

      <option value="correct">Whether the person’s rights override the organisation’s interests</option>
      <!-- Correct answer -->

      <option value="wrong">Whether consent can be ignored</option>
      <!-- Wrong answer -->

      <option value="wrong">Whether a privacy notice is unnecessary</option>
      <!-- Wrong answer -->
    </select>
  </section>

  <section class="question">
    <!-- Question 9 -->

    <label for="q9">9. What does accountability mean?</label>
    <!-- Label for question 9 -->

    <select id="q9">
      <!-- Dropdown menu for question 9 -->
      <option value="">Select an answer</option>

      <option value="correct">Being able to demonstrate GDPR compliance</option>
      <!-- Correct answer -->

      <option value="wrong">Keeping data forever</option>
      <!-- Wrong answer -->

      <option value="wrong">Using consent for everything</option>
      <!-- Wrong answer -->
    </select>
  </section>

  <section class="question">
    <!-- Question 10 -->

    <label for="q10">10. Why should lawful basis be identified before processing starts?</label>
    <!-- Label for question 10 -->

    <select id="q10">
      <!-- Dropdown menu for question 10 -->
      <option value="">Select an answer</option>

      <option value="correct">Because it affects rights, transparency, and compliance</option>
      <!-- Correct answer -->

      <option value="wrong">Because it can always be changed later without issue</option>
      <!-- Wrong answer -->

      <option value="wrong">Because it removes the need for documentation</option>
      <!-- Wrong answer -->
    </select>
  </section>

  <button type="button" onclick="markQuiz()">Submit Quiz</button>
  <!-- Button that runs the JavaScript function to mark the quiz -->

  <div id="quizResult" class="result-box"></div>
  <!-- Empty result box where the quiz score or feedback will appear -->

  <a href="index.html" class="back-link">← Back to Dashboard</a>
  <!-- Link back to the dashboard page -->
</main>

<script src="js/quiz.js"></script>
<!-- Links the JavaScript file that checks answers and shows the result -->

</body>
<!-- Ends the body section -->

</html>
<!-- Ends the HTML document -->

<script src="js/quiz.js"></script>
<!-- This extra script is repeated and outside the HTML document, so it is likely a mistake -->
